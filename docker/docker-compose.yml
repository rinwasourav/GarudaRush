version: '3.8'

services:
  # Central GarudaRush Ingestion & Analytics Server
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: garuda_rush_server
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/
      - PORT=5000
      - API_KEY=${API_KEY:-}
    depends_on:
      - mongo
    restart: unless-stopped

  # MongoDB Database Service
  mongo:
    image: mongo:7.0
    container_name: garuda_rush_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
